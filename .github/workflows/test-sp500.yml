name: Test SP500 dataset

on:
  push:
    branches:
      - add-financial-timeseries-datasets
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest numpy pandas kagglehub

      - name: Run SP500 test
        run: |
          python -m pytest stable_datasets/tests/test_sp500.py -v
